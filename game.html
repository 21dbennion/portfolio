<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exodus: Jetpack Moses</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: linear-gradient(to bottom, #87CEEB 0%, #fdbb2d 100%); border: 4px solid #5d4037; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: block; cursor: pointer; }
        #stats { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
        #instructions { position: absolute; top: 20px; right: 20px; max-width: 280px; color: #fff; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.4; text-shadow: 1px 1px #000; }
        #instructions h2 { margin: 0 0 8px; font-size: 16px; }
        #instructions p { margin: 6px 0; }
    </style>
</head>
<body>

    <div id="stats">
        Distance: <span id="dist">0</span>m<br>
        Coins: <span id="coins">0</span>
    </div>
    <div id="instructions">
        <h2>How to Play</h2>
        <p>Hold mouse click or touch to thrust upward.</p>
        <p>Avoid burning bushes and snakes.</p>
        <p>Collect coins to increase your score.</p>
        <p>If you crash, click/tap to try again.</p>
        <p><a href="scratch.html" style="color:#ffe082; font-weight:700;">Go to Scratch Page</a></p>
    </div>
    <canvas id="gameCanvas"></canvas>

        canvas.width = 800;
        canvas.height = 400;

        // Constants
        const GRAVITY = 0.25;
        const THRUST = 0.7;
        const SPEED = 5;

        // State
        let distance = 0;
        let coinCount = 0;
        let isGameOver = false;
        let isThrusting = false;
        let frame = 0;

        const player = {
            x: 120, y: 200, w: 40, h: 60, vy: 0
        };

        let obstacles = []; // Burning bushes
        let snakes = [];    // Fast moving hazards
        let coins = [];     // Collectibles

        // Inputs
        const startThrust = (e) => { e.preventDefault(); if(isGameOver) reset(); else isThrusting = true; };
        const endThrust = () => isThrusting = false;

        window.addEventListener('mousedown', startThrust);
        window.addEventListener('mouseup', endThrust);
        window.addEventListener('touchstart', startThrust);
        window.addEventListener('touchend', endThrust);

        function reset() {
            player.y = 200; player.vy = 0;
            obstacles = []; snakes = []; coins = [];
            distance = 0; coinCount = 0;
            isGameOver = false;
            update();
        }

        function spawnEntities() {
            // Spawn Coins
            if (frame % 60 === 0) {
                coins.push({ x: 850, y: 50 + Math.random() * 300, r: 10 });
            }
            // Spawn Burning Bushes (Obstacles)
            if (frame % 100 === 0) {
                obstacles.push({ x: 850, y: Math.random() * 300, w: 15, h: 80 });
            }
            // Spawn Snakes (Faster)
            if (frame % 140 === 0) {
                snakes.push({ x: 850, y: Math.random() * 350, w: 32, h: 16, s: SPEED + 2, wave: Math.random() * Math.PI * 2 });
            }
        }

        function drawMoses(x, y) {
            // Staff
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + 35, y - 10);
            ctx.lineTo(x + 35, y + 60);
            ctx.stroke();

            // Jetpack Flame (Divine pillar of fire effect)
            if (isThrusting) {
                ctx.fillStyle = frame % 2 === 0 ? '#ff6600' : '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(x, y + 40);
                ctx.lineTo(x - 15, y + 70);
                ctx.lineTo(x + 10, y + 40);
                ctx.fill();
            }

            // Robe
            ctx.fillStyle = '#f5f5dc';
            ctx.fillRect(x, y, 30, 50);
            ctx.fillStyle = '#3f51b5'; // Blue sash
            ctx.fillRect(x, y + 20, 30, 10);

            // Head with simple facial expression
            ctx.fillStyle = '#ffe0bd';
            ctx.beginPath();
            ctx.arc(x + 15, y - 4, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2b2b2b';
            ctx.beginPath();
            ctx.arc(x + 11, y - 6, 1.4, 0, Math.PI * 2);
            ctx.arc(x + 19, y - 6, 1.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2b2b2b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x + 15, y - 1, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(x + 7, y + 4);
            ctx.lineTo(x + 23, y + 4);
            ctx.lineTo(x + 15, y + 16);
            ctx.closePath();
            ctx.fill();
        }

        function update() {
            if (isGameOver) return;
            frame++;
            distance += 0.1;
            distEl.innerText = Math.floor(distance);

            // Physics
            if (isThrusting) player.vy -= THRUST;
            player.vy += GRAVITY;
            player.y += player.vy;

            // Floor/Ceiling
            if (player.y > canvas.height - player.h - 20) {
                player.y = canvas.height - player.h - 20;
                player.vy = 0;
            }
            if (player.y < 20) {
                player.y = 20;
                player.vy = 0;
            }

            spawnEntities();

            // Handle Coins
            coins.forEach((c, i) => {
                c.x -= SPEED;
                // Collision
                if (Math.hypot(player.x + 15 - c.x, player.y + 25 - c.y) < 25) {
                    coins.splice(i, 1);
                    coinCount += 10;
                    coinEl.innerText = coinCount;
                }
            });

            // Handle Burning Bushes
            obstacles.forEach((o, i) => {
                o.x -= SPEED;
                if (player.x < o.x + o.w && player.x + 30 > o.x && player.y < o.y + o.h && player.y + 50 > o.y) {
                    isGameOver = true;
                }
            });

            // Handle Snakes
            snakes.forEach((s, i) => {
                s.x -= s.s;
                s.wave += 0.18;
                s.y += Math.sin(s.wave) * 0.8;
                if (player.x < s.x + s.w && player.x + 30 > s.x && player.y < s.y + s.h && player.y + 50 > s.y) {
                    isGameOver = true;
                }
            });

            // Cleanup
            [coins, obstacles, snakes].forEach(arr => {
                if(arr[0] && arr[0].x < -50) arr.shift();
            });

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground (Sand)
            ctx.fillStyle = '#e3c48d';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // Draw Coins (Shekels)
            coins.forEach(c => {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b8860b';
                ctx.stroke();
            });

            // Draw Burning Bushes
            obstacles.forEach(o => {
                ctx.fillStyle = '#2f7d32';
                ctx.fillRect(o.x - 6, o.y + 8, o.w + 12, o.h - 8);
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(o.x + 4, o.y + o.h - 14, 6, 14);
                ctx.fillStyle = frame % 12 < 6 ? '#ff6f00' : '#ffca28';
                ctx.beginPath();
                ctx.moveTo(o.x + 7, o.y - 8);
                ctx.lineTo(o.x - 2, o.y + 10);
                ctx.lineTo(o.x + 16, o.y + 10);
                ctx.closePath();
                ctx.fill();
            });

            // Draw Snakes
            snakes.forEach(s => {
                ctx.strokeStyle = '#1b5e20';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.h / 2);
                ctx.quadraticCurveTo(s.x + s.w * 0.35, s.y - 6, s.x + s.w * 0.6, s.y + s.h / 2);
                ctx.quadraticCurveTo(s.x + s.w * 0.82, s.y + s.h + 6, s.x + s.w, s.y + s.h / 2);
                ctx.stroke();
                ctx.fillStyle = '#33691e';
                ctx.beginPath();
                ctx.arc(s.x + s.w, s.y + s.h / 2, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            drawMoses(player.x, player.y);

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.font = 'bold 40px Arial';
                ctx.fillText('LET MY PEOPLE GO!', canvas.width/2, canvas.height/2);
                ctx.font = '20px Arial';
                ctx.fillText('Click to Try Again', canvas.width/2, canvas.height/2 + 50);
                if (mosesHeadReady) {
                    ctx.drawImage(mosesHeadImg, canvas.width / 2 - 40, canvas.height / 2 - 150, 80, 80);
                }
            }
        }

        update();
    </script>
</body>
</html>
